<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电梯状态监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .elevator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .elevator-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .elevator-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }

        .elevator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .elevator-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .elevator-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-running {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-idle {
            background: #fff3e0;
            color: #e65100;
        }

        .status-door-open {
            background: #e3f2fd;
            color: #1565c0;
        }

        .current-floor {
            text-align: center;
            margin: 20px 0;
        }

        .floor-number {
            font-size: 4rem;
            font-weight: bold;
            color: #667eea;
        }

        .floor-label {
            font-size: 1rem;
            color: #666;
            margin-top: 5px;
        }

        .direction-indicator {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .direction-btn {
            padding: 10px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: #666;
        }

        .direction-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .direction-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .eta-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }

        .eta-title {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 10px;
        }

        .eta-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .controls-section {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .controls-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .floor-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .floor-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .floor-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .floor-btn.selected {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .selected-floor-info {
            background: #e8f5e9;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .selected-floor-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
        }

        .selected-floor-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2e7d32;
        }

        .system-info {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .info-card {
            background: rgba(255,255,255,0.9);
            border-radius: 12px;
            padding: 15px 30px;
            text-align: center;
        }

        .info-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .pulse {
            animation: pulse 1s ease-in-out infinite;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .floor-btn {
                width: 50px;
                height: 50px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 电梯状态监控系统</h1>

        <div class="elevator-grid" id="elevatorGrid">
        </div>

        <div class="controls-section">
            <div class="controls-title">📱 呼叫电梯到指定楼层</div>
            <div class="floor-selector" id="floorSelector">
            </div>
            <div class="selected-floor-info">
                <div class="selected-floor-label">您选择的楼层</div>
                <div class="selected-floor-value" id="selectedFloor">--</div>
            </div>
        </div>

        <div class="system-info">
            <div class="info-card">
                <div class="info-label">系统状态</div>
                <div class="info-value" id="systemStatus">✅ 正常运行</div>
            </div>
            <div class="info-card">
                <div class="info-label">当前时间</div>
                <div class="info-value" id="currentTime">--:--:--</div>
            </div>
            <div class="info-card">
                <div class="info-label">服务楼层</div>
                <div class="info-value">1-17层</div>
            </div>
        </div>
    </div>

    <script>
        class Elevator {
            constructor(id, name, currentFloor = 1) {
                this.id = id;
                this.name = name;
                this.currentFloor = currentFloor;
                this.targetFloor = null;
                this.direction = 'idle'; // 'up', 'down', 'idle'
                this.status = 'idle'; // 'running', 'idle', 'door-open'
                this.passengers = 0;
                this.maxCapacity = 12;
                this.speed = 1; // 层/秒
                this.doorTime = 3; // 开关门时间（秒）
                this.position = 0; // 精确位置（0-1表示当前楼层内位置）
                this.targetQueue = [];
            }

            goToFloor(floor) {
                if (floor < 1 || floor > 17) return;
                if (floor === this.currentFloor && this.status === 'idle') {
                    this.openDoors();
                    return;
                }
                
                if (!this.targetQueue.includes(floor)) {
                    this.targetQueue.push(floor);
                    this.targetQueue.sort((a, b) => {
                        const dir = this.direction === 'up' ? 1 : -1;
                        return (a - b) * dir;
                    });
                }
                
                if (this.status === 'idle') {
                    this.processNextTarget();
                }
            }

            processNextTarget() {
                if (this.targetQueue.length === 0) {
                    this.status = 'idle';
                    this.direction = 'idle';
                    return;
                }
                
                this.targetFloor = this.targetQueue.shift();
                this.status = 'running';
                
                if (this.targetFloor > this.currentFloor) {
                    this.direction = 'up';
                } else {
                    this.direction = 'down';
                }
            }

            update(deltaTime) {
                if (this.status !== 'running') return;
                
                const distance = this.targetFloor - this.currentFloor;
                const absDistance = Math.abs(distance);
                
                this.position += deltaTime * this.speed;
                
                if (this.position >= 1) {
                    this.position = 0;
                    if (this.direction === 'up') {
                        this.currentFloor++;
                    } else {
                        this.currentFloor--;
                    }
                    
                    if (this.currentFloor === this.targetFloor) {
                        this.openDoors();
                    }
                }
            }

            openDoors() {
                this.status = 'door-open';
                this.direction = 'idle';
                
                setTimeout(() => {
                    this.closeDoors();
                }, this.doorTime * 1000);
            }

            closeDoors() {
                this.status = 'idle';
                this.processNextTarget();
            }

            calculateETA(targetFloor) {
                if (this.currentFloor === targetFloor) return 0;
                
                let eta = 0;
                let current = this.currentFloor;
                let direction = this.direction;
                
                if (direction === 'idle') {
                    direction = targetFloor > current ? 'up' : 'down';
                }
                
                eta += Math.abs(targetFloor - current) * 1;
                
                if (this.status === 'door-open') {
                    eta += this.doorTime;
                }
                
                return Math.max(0, Math.round(eta));
            }
        }

        class ElevatorSystem {
            constructor() {
                this.elevators = [
                    new Elevator(1, 'E1', 1),
                    new Elevator(2, 'E2', 5),
                    new Elevator(3, 'E3', 10),
                    new Elevator(4, 'E4', 15)
                ];
                this.selectedFloor = null;
                this.updateInterval = null;
                this.lastTime = performance.now();
            }

            start() {
                this.render();
                this.lastTime = performance.now();
                this.updateInterval = setInterval(() => {
                    this.gameLoop();
                }, 100);
                
                this.updateTime();
                setInterval(() => this.updateTime(), 1000);
            }

            gameLoop() {
                const currentTime = performance.now();
                const deltaTime = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;
                
                this.elevators.forEach(elevator => {
                    elevator.update(deltaTime);
                });
                
                this.render();
            }

            selectFloor(floor) {
                this.selectedFloor = floor;
                
                let bestElevator = null;
                let minETA = Infinity;
                
                this.elevators.forEach(elevator => {
                    const eta = elevator.calculateETA(floor);
                    if (eta < minETA) {
                        minETA = eta;
                        bestElevator = elevator;
                    }
                });
                
                if (bestElevator) {
                    bestElevator.goToFloor(floor);
                }
                
                this.render();
            }

            render() {
                const grid = document.getElementById('elevatorGrid');
                grid.innerHTML = '';
                
                this.elevators.forEach(elevator => {
                    const eta = this.selectedFloor 
                        ? elevator.calculateETA(this.selectedFloor) 
                        : '--';
                    
                    const card = document.createElement('div');
                    card.className = 'elevator-card';
                    card.innerHTML = `
                        <div class="elevator-header">
                            <div class="elevator-name">${elevator.name}</div>
                            <div class="elevator-status status-${elevator.status}">${this.getStatusText(elevator.status)}</div>
                        </div>
                        <div class="current-floor">
                            <div class="floor-number">${elevator.currentFloor}</div>
                            <div class="floor-label">当前楼层</div>
                        </div>
                        <div class="direction-indicator">
                            <button class="direction-btn ${elevator.direction === 'up' ? 'active' : ''}" onclick="system.elevators[${elevator.id - 1}].goToFloor(17)">⬆️ 上行</button>
                            <button class="direction-btn ${elevator.direction === 'down' ? 'active' : ''}" onclick="system.elevators[${elevator.id - 1}].goToFloor(1)">⬇️ 下行</button>
                        </div>
                        <div class="eta-section">
                            <div class="eta-title">到达目标楼层 ETA</div>
                            <div class="eta-value">${eta}s</div>
                        </div>
                        <div style="text-align: center; margin-top: 10px; color: #888; font-size: 0.85rem;">
                            🧑‍🤝‍🧑 ${elevator.passengers}/${elevator.maxCapacity} 人
                        </div>
                    `;
                    grid.appendChild(card);
                });
                
                document.getElementById('selectedFloor').textContent = this.selectedFloor || '--';
            }

            getStatusText(status) {
                const texts = {
                    'running': '运行中',
                    'idle': '空闲',
                    'door-open': '开门中'
                };
                return texts[status] || status;
            }

            updateTime() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
                document.getElementById('currentTime').textContent = timeStr;
            }

            stop() {
                if (this.updateInterval) {
                    clearInterval(this.updateInterval);
                }
            }
        }

        let system;

        document.addEventListener('DOMContentLoaded', () => {
            system = new ElevatorSystem();
            system.start();
            
            const floorSelector = document.getElementById('floorSelector');
            for (let i = 1; i <= 17; i++) {
                const btn = document.createElement('button');
                btn.className = 'floor-btn';
                btn.textContent = i;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    system.selectFloor(i);
                });
                floorSelector.appendChild(btn);
            }
        });
    </script>
</body>
</html>
